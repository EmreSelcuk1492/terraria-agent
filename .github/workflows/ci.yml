name: ci
on: [push, pull_request]
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0  # findings cite commits; the lint checks they exist
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install anthropic httpx posthog pytest
      # lint + shell syntax + compile + json + feature map + offline tests (mock world; no game, no lab, no telemetry)
      - run: python .claude/skills/verify/verify.py check
        env:
          TA_TELEMETRY: "0"
